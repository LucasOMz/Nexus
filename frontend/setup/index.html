<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuração inicial</title>
<!-- Caminhos ABSOLUTOS, de propósito.
     A página é servida em /instalacao (sem barra no fim). Com caminho
     relativo, o navegador resolveria "setup.css" a partir de "/" e pediria
     /setup.css — que não existe. A página vinha sem estilo e sem script,
     ficando presa em "Carregando…". -->
<link rel="stylesheet" href="/instalacao/setup.css">
</head>
<body>
<noscript>
  <div id="sem-js">
    <b>O JavaScript está desativado.</b><br>
    O assistente de configuração precisa dele para funcionar. Ative o JavaScript
    neste navegador e recarregue a página.
  </div>
</noscript>

<main class="caixa" id="caixa">
  <header class="topo">
    <div class="marca">
      <div class="marca-icone" id="marca-icone">GP</div>
      <div>
        <h1 id="marca-titulo">Gestão Patrimonial</h1>
        <p class="muted" id="marca-sub">Configuração inicial do sistema</p>
      </div>
    </div>
    <div class="passos" id="passos"></div>
  </header>

  <section id="conteudo" class="conteudo">
    <p class="muted">Carregando…</p>
  </section>

  <footer class="rodape">
    <button class="btn text" id="voltar" type="button">Voltar</button>
    <div class="espaco"></div>
    <span class="muted" id="aviso"></span>
    <button class="btn filled" id="avancar" type="button">Continuar</button>
  </footer>
</main>

<script src="/instalacao/setup.js"></script>
</body>
</html>
