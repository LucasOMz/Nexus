name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: teste
        ports:
          - 5432/tcp
        options: --health-cmd "pg_isready -U teste -d teste" --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379/tcp
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Tests (pytest)
        env:
          NEXUS_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/0
          NEXUS_TEST_POSTGRES_URL: postgresql+psycopg://teste:teste@127.0.0.1:${{ job.services.postgres.ports[5432] }}/teste
        run: pytest --cov=app --cov-report=term-missing

  container:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: nexus-ci-runtime
      API_PORT: 14545
      NEXUS_BACKUP_DIR: ${{ runner.temp }}/nexus-runtime-backups
    steps:
      - uses: actions/checkout@v4
      - name: Verificar execução sem root e validar backup PostgreSQL
        run: |
          sudo install -d -o 10001 -g 10001 -m 0750 "$NEXUS_BACKUP_DIR"
          docker compose up -d --wait db redis
          docker compose run --rm --no-deps --build -T api python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryFile

          assert (os.getuid(), os.getgid()) == (10001, 10001)
          assert os.statvfs("/app").f_flag & os.ST_RDONLY
          status = dict(line.split(":", 1) for line in Path("/proc/self/status").read_text().splitlines())
          assert int(status["CapEff"], 16) == 0
          assert status["NoNewPrivs"].strip() == "1"
          with TemporaryFile(dir="/tmp") as tmp:
              tmp.write(b"temporario")

          from app.core.rate_limit import redis_contadores
          from app.database import init_db
          from app.services.backup_service import criar_backup, validar_backup

          assert redis_contadores is not None
          assert redis_contadores.is_allowed("ci", "volume", 60, 2) is True
          init_db()
          meta = criar_backup("ci")
          assert meta["tipo"] == "postgres" and meta["tamanho_bytes"] > 0
          validacao = validar_backup(meta["arquivo"])
          assert validacao["ok"], validacao
          PY
      - name: Verificar migração sem perda de arquivos
        run: |
          docker compose run --rm --no-deps --build -T --entrypoint /bin/sh ajustar-volumes -ec \
            'printf legado > /app/media/legado; printf segredo > /app/segredos/legado.txt; chmod 600 /app/segredos/legado.txt; chown 0:0 /app/segredos'
          docker compose up -d --build api
          docker compose exec -T api python - <<'PY'
          from pathlib import Path

          for caminho, esperado in (("/app/media/legado", "legado"), ("/app/segredos/legado.txt", "segredo")):
              arquivo = Path(caminho)
              assert arquivo.read_text() == esperado
              assert arquivo.stat().st_uid == 10001
          assert Path("/app/segredos/legado.txt").stat().st_mode & 0o777 == 0o600
          PY
      - name: Verificar HTTP após recriar a API
        run: |
          verificar_http() {
            curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors \
              "http://127.0.0.1:$API_PORT/health" | grep -F '"database":true'
          }
          verificar_http
          docker compose up -d --no-deps --force-recreate api
          verificar_http
      - name: Encerrar ambiente descartável
        if: always()
        run: docker compose down --volumes
