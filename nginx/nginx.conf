# Template processado pela imagem oficial do Nginx.
server {
    listen 80 default_server;
    server_name ${NEXUS_PUBLIC_HOST};

    return 308 https://${NEXUS_PUBLIC_HOST}$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name ${NEXUS_PUBLIC_HOST};

    ssl_certificate     /etc/nginx/nexus-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/nexus-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $nexus_upstream http://api:4545;
        proxy_pass $nexus_upstream;
        proxy_set_header Host ${NEXUS_PUBLIC_HOST};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
