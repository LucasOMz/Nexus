# =====================================================================
# Nginx — reverse proxy para a API + HTTPS (Let's Encrypt)
#
# O bloco HTTPS abaixo fica pronto para quando o certificado for emitido.
# Para emitir com certbot:
#   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#     -d seu-dominio.com
# =====================================================================

# Redireciona HTTP -> HTTPS (descomente após emitir o certificado)
# server {
#     listen 80;
#     server_name seu-dominio.com;
#     location /.well-known/acme-challenge/ { root /var/www/certbot; }
#     location / { return 301 https://$host$request_uri; }
# }

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;  # anexos de manutenção

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

