# Template processado pela imagem oficial do Nginx.
upstream nexus_api {
    server unix:/run/nexus/uvicorn.sock;
}

map "${NEXUS_HTTPS_PORT}" $nexus_https_suffix {
    443 "";
    default ":${NEXUS_HTTPS_PORT}";
}

server {
    listen 80 default_server;
    server_name ${NEXUS_PUBLIC_HOST};

    return 308 https://${NEXUS_PUBLIC_HOST}$nexus_https_suffix$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name ${NEXUS_PUBLIC_HOST};

    ssl_certificate     /etc/nginx/nexus-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/nexus-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://nexus_api;
        proxy_set_header Host ${NEXUS_PUBLIC_HOST}$nexus_https_suffix;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
