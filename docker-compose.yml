# =====================================================================
# Nexus — stack (api + postgres)
# Suba tudo com:  docker compose up -d --build
#
# IMPORTANTE: os volumes abaixo guardam os dados que NÃO podem se perder.
# Sem eles, fotos/termos/anexos e backups vivem dentro do container e
# desaparecem ao recriar a stack (docker compose up --build).
#
# ---------------------------------------------------------------------
# Sobre o NGINX (removido em 3.24.0)
#
# Esta stack tinha um `nginx` fazendo proxy para a API. Ele foi removido
# porque **não fazia nada**: o TLS estava comentado, não havia cache nem
# compressão, e a API já é publicada direto na porta 8000.
#
# Pior: o `client_max_body_size 25m` dele não protegia nada, porque a porta
# 8000 está aberta — qualquer um chamava a API direto, ao lado do proxy.
# Era um posto de pedágio ao lado de uma estrada aberta.
#
# ## Quando ele volta
#
# Quando houver domínio e certificado. Aí ele deixa de ser enfeite e passa
# a ser a peça que termina o TLS — e o ajuste que importa é **fechar a porta
# 8000**, deixando só o nginx exposto. Sem isso, o limite continua
# contornável.
#
# ## Antes de expor na internet
#
# Sem TLS, senha e token trafegam em texto claro. Em rede interna ou VPN,
# tudo bem. Na internet aberta, não.
# =====================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estoque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estoque}
      POSTGRES_DB: ${POSTGRES_DB:-estoque}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estoque} -d ${POSTGRES_DB:-estoque}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- Banco de dados ------------------------------------------------
      #
      # A linha antiga calculava a URL **sempre** a partir dos POSTGRES_*, então
      # definir DATABASE_URL no stack não tinha efeito nenhum — quem tentava
      # apontar para um PostgreSQL externo continuava no banco do compose, sem
      # erro e sem pista.
      #
      # Agora: se DATABASE_URL vier definido, ele manda. Senão, monta a partir
      # dos POSTGRES_* (o banco do compose).
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-estoque}:${POSTGRES_PASSWORD:-estoque}@db:5432/${POSTGRES_DB:-estoque}}

      # --- Segredos ------------------------------------------------------
      #
      # Estes eram obrigatórios (`:?`) e a stack **falhava ao ser criada** se
      # não estivessem definidos. A intenção era certa — os padrões no código
      # são `"troque-este-segredo-jwt"`, publicados no repositório — mas o
      # custo era a primeira implantação não subir.
      #
      # Agora: se a variável não vier, o primeiro boot **gera 256 bits** e
      # grava no volume `segredos`. Se vier, o valor do operador manda.
      #
      # Deixar vazio aqui é o caminho normal. Definir só é necessário para
      # migrar de uma instalação antiga ou para rotacionar.
      JWT_SECRET: ${JWT_SECRET:-}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:-}
      # Pasta onde os segredos gerados são guardados. Sem o volume abaixo, um
      # segredo novo nasceria a cada recriação do container — e então todos os
      # logins caem e todas as etiquetas QR impressas param de validar.
      NEXUS_SEGREDOS_DIR: /app/segredos

      # Aceita segredos antigos de QR, para não invalidar etiquetas já coladas.
      QR_HMAC_SECRETS_ANTERIORES: ${QR_HMAC_SECRETS_ANTERIORES:-}
      QR_EXIGIR_ASSINATURA: ${QR_EXIGIR_ASSINATURA:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://seu-dominio.com}
      ENV: production
      AUTO_CREATE_TABLES: "true"
      PRINT_AGENT_URL: ${PRINT_AGENT_URL:-http://raspberry:9100}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@empresa.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      # Backups: pasta persistente DENTRO do container (volume abaixo).
      BACKUP_DIR: /app/backups
      BACKUP_RETER: ${BACKUP_RETER:-30}
      # Chave mestra das licenças de software.
      #
      # ATENÇÃO: sem ela, cadastrar licença com chave falha — o módulo de
      # software não tem como cifrar. E se ela se perder, as chaves
      # cadastradas ficam IRRECUPERÁVEIS: o backup do banco não a contém,
      # de propósito.
      #
      # Guarde num cofre separado. Para girar sem perder o legado:
      #   NEXUS_CHAVE_LICENCAS_V1     = <a chave antiga>
      #   NEXUS_CHAVE_LICENCAS_VERSAO = 2
      NEXUS_CHAVE_LICENCAS: ${NEXUS_CHAVE_LICENCAS:-}
      NEXUS_CHAVE_LICENCAS_VERSAO: ${NEXUS_CHAVE_LICENCAS_VERSAO:-1}
    volumes:
      # Fotos, termos e anexos. NUNCA remova este volume.
      - media:/app/media
      # Backups do banco. Para gravar em pasta de rede, troque por bind mount
      # do compartilhamento já montado no host, ex.:
      #   - /mnt/backups/estoque:/app/backups
      - backups:/app/backups
      # Segredos gerados no primeiro boot (JWT, QR, chave mestra).
      #
      # NUNCA remova este volume depois de haver etiquetas impressas e
      # licenças cadastradas. Perdê-lo gera segredos novos, e com eles:
      # todos os logins caem, todas as etiquetas QR param de validar, e as
      # chaves de licença ficam IRRECUPERÁVEIS.
      - segredos:/app/segredos
    ports:
      # Host : Container. Os dois lados precisam bater com o `--port` do
      # Dockerfile. Quando divergiram (aqui 5000, lá 8000), o Docker publicou
      # uma porta em que nada escutava — a conexão era aceita e fechada na
      # hora, e o `curl` respondia com
      # `recv failure: conexão fechada pela outra ponta`.
      - "${API_PORT:-4545}:4545"

volumes:
  pgdata:
  media:
  backups:
  # Segredos gerados no primeiro boot. Ver o comentário em `volumes:` do
  # serviço da API — perder este volume invalida logins, etiquetas e
  # licenças.
  segredos:
